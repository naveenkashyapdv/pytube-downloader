<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YouTube Downloader</title>
    <style>
        :root { color-scheme: light; font-family: system-ui, sans-serif; }
        body { display: grid; min-height: 100vh; place-items: center; margin: 0; background: #eef3f7; color: #18222d; }
        main { width: min(560px, calc(100% - 40px)); padding: 36px; border: 1px solid #d5dee7; border-radius: 12px; background: white; box-shadow: 0 12px 32px #1b31401a; text-align: center; }
        h1 { margin: 0 0 12px; }
        p { line-height: 1.6; }
        .notice { padding: 14px; border-radius: 8px; background: #fff4d6; }
    </style>
</head>
<body>
    <main>
        <h1>YouTube Downloader</h1>
        <p class="notice">GitHub Pages only serves static files. It cannot run the Flask downloader or process POST requests.</p>
        <p>Open the URL of your deployed Render web service to download videos and playlists.</p>
    </main>
</body>
</html>
